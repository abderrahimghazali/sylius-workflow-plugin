services:
    _defaults:
        autowire: true
        autoconfigure: true

    Abderrahim\SyliusWorkflowPlugin\:
        resource: '../src/'
        exclude:
            - '../src/SyliusWorkflowPlugin.php'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/DependencyInjection/'
            - '../src/Graph/Node/'
            - '../src/Messenger/DelayedWorkflowMessage.php'
            - '../src/Repository/'

    # Repository aliases (created by Sylius resource system)
    Abderrahim\SyliusWorkflowPlugin\Repository\WorkflowCampaignRepository:
        alias: workflow.repository.campaign

    Abderrahim\SyliusWorkflowPlugin\Repository\WorkflowRunRepository:
        alias: workflow.repository.run

    # Graph Executor — inject tagged rules and actions
    Abderrahim\SyliusWorkflowPlugin\Graph\WorkflowExecutor:
        arguments:
            $rules: !tagged_iterator sylius_workflow.rule
            $actions: !tagged_iterator sylius_workflow.action
            $maxSteps: '%sylius_workflow.execution.max_steps%'

    # Menu Listener
    Abderrahim\SyliusWorkflowPlugin\Menu\AdminMenuListener:
        tags:
            - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addWorkflowMenu }

    # Form Types
    Abderrahim\SyliusWorkflowPlugin\Form\Type\WorkflowCampaignType:
        tags:
            - { name: form.type }

    # Controllers
    Abderrahim\SyliusWorkflowPlugin\Controller\Admin\WorkflowCampaignController:
        tags:
            - { name: controller.service_arguments }

    Abderrahim\SyliusWorkflowPlugin\Controller\Admin\WorkflowRunController:
        tags:
            - { name: controller.service_arguments }

    Abderrahim\SyliusWorkflowPlugin\Controller\Admin\AnalyticsController:
        tags:
            - { name: controller.service_arguments }

    Abderrahim\SyliusWorkflowPlugin\Api\WorkflowGraphController:
        tags:
            - { name: controller.service_arguments }

    Abderrahim\SyliusWorkflowPlugin\Api\TestRunController:
        tags:
            - { name: controller.service_arguments }

    # Template browser controller — inject tagged templates
    Abderrahim\SyliusWorkflowPlugin\Controller\Admin\TemplateController:
        arguments:
            $templates: !tagged_iterator sylius_workflow.template
        tags:
            - { name: controller.service_arguments }

    # DryRun executor — inject tagged rules
    Abderrahim\SyliusWorkflowPlugin\Graph\DryRunWorkflowExecutor:
        arguments:
            $rules: !tagged_iterator sylius_workflow.rule

    # SendEmailAction — inject Sylius sender config
    Abderrahim\SyliusWorkflowPlugin\Graph\Action\SendEmailAction:
        arguments:
            $senderAddress: '%sylius.mailer.sender_address%'
            $senderName: '%sylius.mailer.sender_name%'

    # GenerateCouponAction — inject Sylius services
    Abderrahim\SyliusWorkflowPlugin\Graph\Action\GenerateCouponAction:
        arguments:
            $promotionRepository: '@sylius.repository.promotion'
            $couponFactory: '@sylius.factory.promotion_coupon'
            $promotionFactory: '@sylius.factory.promotion'
            $promotionActionFactory: '@sylius.factory.promotion_action'
            $channelRepository: '@sylius.repository.channel'

    # SendWebhookAction — inject config
    Abderrahim\SyliusWorkflowPlugin\Graph\Action\SendWebhookAction:
        arguments:
            $timeout: '%sylius_workflow.webhook.timeout%'
            $allowHttp: '%sylius_workflow.webhook.allow_http%'

    # AssignCustomerGroupAction — inject Sylius customer group repository
    Abderrahim\SyliusWorkflowPlugin\Graph\Action\AssignCustomerGroupAction:
        arguments:
            $customerGroupRepository: '@sylius.repository.customer_group'
